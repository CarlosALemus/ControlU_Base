name: CI PR Develop .NET

on:
  pull_request:
    branches:
      - develop

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore test1.sln

      - name: Build
        run: dotnet build test1.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test test1.sln --no-build --configuration Release